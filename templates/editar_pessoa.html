{% load static %}

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Editar Pessoa - Cantina</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
   <div class="layout">
      <!-- MENU LATERAL -->
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-icon">🛒</div>

          <div>
            <h2>CANTINA</h2>
            <span>Sistema de Controle</span>
          </div>
        </div>

        <nav class="menu">
          <a href="{% url 'dashboard' %}" class="menu-item">
            <span>
              <i class="fa-solid fa-house-chimney"></i>
            </span>
            Dashboard
          </a>

          <a href="{% url 'produtos' %}" class="menu-item active">
            <span><i class="fa-solid fa-box-open"></i></span>
            Produtos
          </a>

          <a href="{% url 'categorias' %}" class="menu-item">
            <span><i class="fa-solid fa-tags"></i></span>
            Categorias
          </a>

          <a href="{% url 'pessoas' %}" class="menu-item">
            <span><i class="fa-solid fa-user-group"></i></span>
            Pessoas
          </a>

          <a href="{% url 'vendas' %}" class="menu-item">
            <span><i class="fa-solid fa-cart-shopping"></i></span>
            Vendas
          </a>

          <a href="{% url 'contas_receber' %}" class="menu-item">
            <span><i class="fa-solid fa-sack-dollar"></i></span>
            Contas a Receber
          </a>
        </nav>

        <div class="user-area">
          <div class="user-icon">👤</div>

          <div>
            <strong>Administrador</strong>
            <small>admin</small>
          </div>
        </div>
      </aside>
    <div class="main">
      <div class="topbar">
        <div>
          <h1>Editar Pessoa</h1>

          <p>Altere as informações da pessoa.</p>
        </div>
      </div>

      <div class="panel form-panel">
        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label for="nome"> Nome </label>

            <input
              type="text"
              id="nome"
              name="nome"
              value="{{ pessoa.nome }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="cpf"> CPF </label>

            <input
              type="text"
              id="cpf"
              name="cpf"
              value="{{ pessoa.cpf }}"
              maxlength="14"
              required
            />
          </div>

          <div class="form-group">
            <label for="telefone"> Telefone </label>

            <input
              type="text"
              id="telefone"
              name="telefone"
              value="{{ pessoa.telefone }}"
            />
          </div>

          <div class="form-group">
            <label for="email"> E-mail </label>

            <input
              type="email"
              id="email"
              name="email"
              value="{{ pessoa.email }}"
            />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">
              💾 Salvar Alterações
            </button>

            <a href="{% url 'pessoas' %}" class="btn-secondary"> ↩ Cancelar </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
